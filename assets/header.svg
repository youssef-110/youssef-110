<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="YOUSSEF — Software Engineer, AI Systems, Full-Stack">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03060f"/>
      <stop offset="0.55" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#14224d"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.78" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#2b4fb3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2b4fb3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signalGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe066" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffd21f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd21f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffd21f"/>
      <stop offset="1" stop-color="#e0a800"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="nameClip">
      <text x="72" y="208" font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="112" letter-spacing="10">YOUSSEF</text>
    </clipPath>
    <path id="bat" d="M100,34 L95,34 L92,20 L88,36 L84,40 Q50,26 8,28 Q14,48 28,62 Q40,52 50,62 Q60,56 72,70 Q88,66 100,92 Q112,66 128,70 Q140,56 150,62 Q160,52 172,62 Q186,48 192,28 Q150,26 116,40 L112,36 L108,20 L105,34 Z"/>
    <style>
      .bokeh { animation: drift 14s ease-in-out infinite alternate; }
      .b2 { animation-duration: 18s; animation-delay: -6s; }
      .b3 { animation-duration: 11s; animation-delay: -3s; }
      .b4 { animation-duration: 21s; animation-delay: -9s; }
      .flick { animation: flicker 5s ease-in-out infinite; }
      .f2 { animation-delay: -2.2s; animation-duration: 7s; }
      .f3 { animation-delay: -4s; animation-duration: 6s; }
      .beam { transform-origin: 1010px 380px; animation: sweep 9s ease-in-out infinite alternate; }
      .signal { transform-origin: 985px 92px; animation: pulse 4.5s ease-in-out infinite; }
      .clouds { animation: cloud 30s linear infinite alternate; }
      .name { opacity: 0; animation: rise 1.1s cubic-bezier(.2,.8,.2,1) .25s forwards; }
      .shine { animation: shine 6s ease-in-out 1.6s infinite; }
      .rule { transform-origin: 76px 0; transform: scaleX(0); animation: grow 1s cubic-bezier(.2,.8,.2,1) .9s forwards; }
      .sub { opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) 1.15s forwards; }
      .tag { opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) 1.45s forwards; }
      .win { animation: blink 7s steps(1) infinite; }
      .w2 { animation-delay: -2s; animation-duration: 9s; }
      .w3 { animation-delay: -5s; animation-duration: 11s; }
      .flyer { animation: fly 16s linear 2s infinite; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px, 14px); } }
      @keyframes flicker { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes sweep { from { transform: rotate(-9deg); } to { transform: rotate(4deg); } }
      @keyframes pulse { 0%,100% { opacity: .82; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
      @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(-60px); } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { to { transform: scaleX(1); } }
      @keyframes shine { 0% { transform: translateX(-260px); } 35%,100% { transform: translateX(820px); } }
      @keyframes blink { 0%,100% { opacity: .9; } 40% { opacity: .15; } 70% { opacity: .9; } }
      @keyframes fly { 0% { transform: translate(-120px, 150px) scale(.18); opacity: 0; } 4% { opacity: .9; } 30% { transform: translate(1320px, 40px) scale(.12); opacity: .9; } 31%,100% { opacity: 0; transform: translate(1320px, 40px) scale(.12); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .name,.sub,.tag { opacity: 1; } .rule { transform: none; } }
    </style>
  </defs>

  <!-- sky -->
  <rect width="1200" height="380" fill="url(#sky)"/>
  <rect width="1200" height="380" fill="url(#haze)"/>

  <!-- bokeh (the warm out-of-focus lights from the pfp) -->
  <g filter="url(#blur18)">
    <g class="bokeh"><circle class="flick" cx="640" cy="90" r="26" fill="#ff9f1c"/></g>
    <g class="bokeh b2"><circle class="flick f2" cx="1120" cy="150" r="30" fill="#ffb347"/></g>
    <g class="bokeh b3"><circle class="flick f3" cx="760" cy="250" r="20" fill="#ff7b29"/></g>
    <g class="bokeh b4"><circle class="flick" cx="540" cy="300" r="16" fill="#ffc94d"/></g>
    <g class="bokeh b2"><circle class="flick f3" cx="1060" cy="300" r="22" fill="#ff5f3a" opacity=".7"/></g>
    <g class="bokeh b3"><circle class="flick f2" cx="420" cy="60" r="14" fill="#5b8cff"/></g>
  </g>
  <g filter="url(#blur8)" opacity=".7">
    <g class="bokeh b4"><circle class="flick f2" cx="700" cy="170" r="9" fill="#ffd21f"/></g>
    <g class="bokeh"><circle class="flick f3" cx="880" cy="320" r="7" fill="#ffe066"/></g>
  </g>

  <!-- clouds catching the signal -->
  <g class="clouds" filter="url(#blur18)" opacity=".5">
    <ellipse cx="960" cy="95" rx="210" ry="38" fill="#3a4f8f"/>
    <ellipse cx="1120" cy="70" rx="160" ry="30" fill="#2a3c75"/>
  </g>

  <!-- searchlight beam -->
  <polygon class="beam" points="1000,380 1020,380 1050,40 925,40" fill="url(#beam)" filter="url(#blur3)"/>

  <!-- bat-signal -->
  <g class="signal">
    <ellipse cx="985" cy="92" rx="92" ry="54" fill="url(#signalGlow)" filter="url(#blur8)"/>
    <ellipse cx="985" cy="92" rx="70" ry="40" fill="#ffe680" opacity=".9"/>
    <use href="#bat" transform="translate(985 92) scale(0.62) translate(-100 -58)" fill="#0a1330"/>
  </g>

  <!-- skyline -->
  <g fill="#050913">
    <path d="M0,380 V318 H38 V292 H62 V318 H86 V270 H96 V256 H112 V270 H124 V330 H150 V300 H184 V340 H206 V284 H218 V262 H230 V284 H244 V346 H272 V310 H300 V326 H330 V276 H346 V250 H352 V236 H358 V250 H364 V276 H382 V336 H410 V306 H446 V350 H470 V296 H500 V318 H530 V284 H548 V266 H566 V284 H580 V344 H612 V322 H640 V300 H668 V340 H700 V288 H712 V246 H720 V226 H728 V246 H736 V288 H760 V334 H790 V312 H820 V350 H846 V300 H880 V330 H900 V270 H916 V258 H932 V270 H946 V344 H966 V318 H1000 V290 H1040 V338 H1070 V306 H1096 V280 H1112 V262 H1128 V280 H1146 V328 H1176 V300 H1200 V380 Z"/>
  </g>
  <g fill="#ffd21f">
    <rect class="win" x="94" y="282" width="4" height="5"/>
    <rect class="win w2" x="104" y="296" width="4" height="5"/>
    <rect class="win w3" x="350" y="262" width="4" height="5"/>
    <rect class="win" x="356" y="290" width="4" height="5"/>
    <rect class="win w2" x="552" y="292" width="4" height="5"/>
    <rect class="win w3" x="716" y="258" width="4" height="5"/>
    <rect class="win" x="722" y="300" width="4" height="5"/>
    <rect class="win w3" x="920" y="282" width="4" height="5"/>
    <rect class="win w2" x="1116" y="292" width="4" height="5"/>
    <rect class="win" x="1104" y="312" width="4" height="5"/>
  </g>

  <!-- a bat crossing the sky every so often -->
  <use class="flyer" href="#bat" fill="#02040a"/>

  <!-- name -->
  <g class="name">
    <text x="72" y="208" font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="112" letter-spacing="10" fill="#000" opacity=".55" transform="translate(4 6)">YOUSSEF</text>
    <text x="72" y="208" font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="112" letter-spacing="10" fill="url(#nameFill)">YOUSSEF</text>
    <g clip-path="url(#nameClip)">
      <g transform="skewX(-20)"><rect class="shine" x="0" y="100" width="90" height="130" fill="url(#sheen)" opacity=".55"/></g>
    </g>
  </g>
  <rect class="rule" x="76" y="232" width="150" height="4" rx="2" fill="#ffd21f"/>
  <text class="sub" x="76" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="24" letter-spacing="1.5" fill="#dfe6ff">Software Engineer · AI Systems · Full-Stack</text>
  <text class="tag" x="76" y="104" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" letter-spacing="4" fill="#7f95d6">// GOTHAM NIGHT SHIFT · BUILDING IN THE DARK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b4fb3" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2b4fb3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#2b4fb3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd21f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd21f" stop-opacity="0"/>
    </radialGradient>
    <path id="bat" d="M100,34 L95,34 L92,20 L88,36 L84,40 Q50,26 8,28 Q14,48 28,62 Q40,52 50,62 Q60,56 72,70 Q88,66 100,92 Q112,66 128,70 Q140,56 150,62 Q160,52 172,62 Q186,48 192,28 Q150,26 116,40 L112,36 L108,20 L105,34 Z"/>
    <style>
      .sweep { animation: sweep 5s cubic-bezier(.45,0,.55,1) infinite alternate; }
      .glow { animation: glow 2.5s ease-in-out infinite; }
      @keyframes sweep { from { transform: translateX(80px); } to { transform: translateX(840px); } }
      @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="0" y="19.5" width="1000" height="1" fill="url(#line)"/>
  <g class="sweep">
    <ellipse cx="40" cy="20" rx="60" ry="10" fill="url(#spot)" opacity=".5"/>
    <rect x="0" y="19" width="80" height="2" fill="#ffd21f" opacity=".9"/>
  </g>
  <rect x="478" y="8" width="44" height="24" rx="12" fill="#070d20"/>
  <use class="glow" href="#bat" transform="translate(485 11) scale(0.15)" fill="#ffd21f"/>
</svg>
